<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Password Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6">
        <!-- เนื้อหาจะถูกเรนเดอร์ด้วย JavaScript -->
    </div>

    <script>
        // เชื่อมต่อ Supabase
        const SUPABASE_URL = "https://rzkaqtqzxzegjajfhhop.supabase.co";
        const SUPABASE_KEY = "sb_publishable_A2XbuxxE-NcYdlca3OWSbw_YsXBocz3";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = JSON.parse(localStorage.getItem('vault_user')) || null;
        let passwords = [];

        async function init() {
            if (!currentUser) {
                renderAuth();
            } else {
                await fetchPasswords();
                renderDashboard();
            }
        }

        // หน้าล็อกอิน / สมัครสมาชิก
        function renderAuth() {
            document.getElementById('app').innerHTML = `
                <div class="text-center mb-6">
                    <h1 class="text-2xl font-bold text-indigo-400">Family Vault</h1>
                    <p class="text-sm text-slate-400 mt-1">ระบบเก็บรหัสผ่านส่วนตัว ปลอดภัย ไร้กังวล</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">ชื่อผู้ใช้ (Username)</label>
                        <input type="text" id="username" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500" placeholder="เช่น mom, dad, myname">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">รหัสผ่าน (Password)</label>
                        <input type="password" id="pin" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500" placeholder="รหัสผ่านเข้าใช้งาน">
                    </div>
                    <div id="auth-error" class="text-red-400 text-xs text-center hidden"></div>
                    <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">เข้าสู่ระบบ</button>
                    <button onclick="handleRegister()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold py-3 rounded-xl transition">สร้างบัญชีใหม่</button>
                </div>
            `;
        }

        async function handleLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('pin').value.trim();
            const err = document.getElementById('auth-error');

            if (!u || !p) {
                err.textContent = 'กรุณากรอกข้อมูลให้ครบถ้วน';
                err.classList.remove('hidden');
                return;
            }

            const { data, error } = await supabaseClient.from('users').select('*').eq('username', u).single();
            if (error || !data || data.pin !== p) {
                err.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
                err.classList.remove('hidden');
                return;
            }

            currentUser = data;
            localStorage.setItem('vault_user', JSON.stringify(currentUser));
            init();
        }

        async function handleRegister() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('pin').value.trim();
            const err = document.getElementById('auth-error');

            if (!u || !p) {
                err.textContent = 'กรุณากรอกข้อมูลให้ครบถ้วน';
                err.classList.remove('hidden');
                return;
            }

            const { data: existing } = await supabaseClient.from('users').select('*').eq('username', u).single();
            if (existing) {
                err.textContent = 'ชื่อผู้ใช้นี้ถูกใช้งานแล้ว';
                err.classList.remove('hidden');
                return;
            }

            const { data, error } = await supabaseClient.from('users').insert([{ username: u, pin: p }]).select().single();
            if (error) {
                err.textContent = 'เกิดข้อผิดพลาดในการสมัครสมาชิก';
                err.classList.remove('hidden');
                return;
            }

            currentUser = data;
            localStorage.setItem('vault_user', JSON.stringify(currentUser));
            init();
        }

        async function fetchPasswords() {
            const { data } = await supabaseClient.from('passwords').select('*').eq('user_id', currentUser.id);
            passwords = data || [];
        }

        // หน้าแดชบอร์ดหลัก
        function renderDashboard() {
            document.getElementById('app').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-lg font-bold text-slate-100">สวัสดี, ${currentUser.username}</h2>
                        <p class="text-xs text-slate-400">จัดการรหัสผ่านของคุณ</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="renderChangePassword()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg transition">เปลี่ยนรหัส</button>
                        <button onclick="logout()" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 text-xs px-3 py-2 rounded-lg transition">ออก</button>
                    </div>
                </div>

                <button onclick="renderAddEdit()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm mb-4 transition shadow-lg shadow-indigo-600/20">+ เพิ่มรหัสผ่านใหม่</button>

                <div class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                    ${passwords.length === 0 ? '<p class="text-center text-slate-500 text-sm py-8">ยังไม่มีข้อมูลรหัสผ่าน</p>' : ''}
                    ${passwords.map(item => `
                        <div class="bg-slate-900 border border-slate-700/60 p-4 rounded-xl flex justify-between items-center">
                            <div>
                                <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded">${item.category}</span>
                                <h3 class="font-semibold text-sm mt-1">${item.title}</h3>
                                <p class="text-xs text-slate-400">User: ${item.username}</p>
                                <p class="text-xs text-slate-400">Pass: <span id="pass-${item.id}">••••••••</span> <button onclick="togglePass('${item.id}', '${item.password}')" class="text-indigo-400 ml-1">👁️</button></p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="renderAddEdit('${item.id}')" class="text-slate-400 hover:text-slate-200 text-xs">✏️</button>
                                <button onclick="deletePassword('${item.id}')" class="text-red-400 hover:text-red-300 text-xs">🗑️</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function togglePass(id, pass) {
            const el = document.getElementById(`pass-${id}`);
            if (el.textContent === '••••••••') {
                el.textContent = pass;
            } else {
                el.textContent = '••••••••';
            }
        }

        function logout() {
            localStorage.removeItem('vault_user');
            currentUser = null;
            init();
        }

        // หน้าเพิ่ม / แก้ไขรหัสผ่าน
        function renderAddEdit(id = null) {
            const item = id ? passwords.find(p => p.id === id) : { title: '', username: '', password: '', category: 'อื่นๆ', notes: '' };
            document.getElementById('app').innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold">${id ? 'แก้ไขรหัสผ่าน' : 'เพิ่มรหัสผ่านใหม่'}</h2>
                    <button onclick="renderDashboard()" class="text-slate-400 text-sm">✕ ยกเลิก</button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">ชื่อเว็บไซต์ / บริการ</label>
                        <input type="text" id="f-title" value="${item.title}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">ชื่อผู้ใช้ / อีเมล</label>
                        <input type="text" id="f-username" value="${item.username}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">รหัสผ่าน</label>
                        <input type="text" id="f-password" value="${item.password}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">หมวดหมู่</label>
                        <select id="f-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                            <option ${item.category === 'โซเชียล' ? 'selected' : ''}>โซเชียล</option>
                            <option ${item.category === 'ธนาคาร/การเงิน' ? 'selected' : ''}>ธนาคาร/การเงิน</option>
                            <option ${item.category === 'อีเมล' ? 'selected' : ''}>อีเมล</option>
                            <option ${item.category === 'อื่นๆ' ? 'selected' : ''}>อื่นๆ</option>
                        </select>
                    </div>
                    <button onclick="savePassword('${id || ''}')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl text-sm mt-2 transition">บันทึกข้อมูล</button>
                </div>
            `;
        }

        async function savePassword(id) {
            const title = document.getElementById('f-title').value.trim();
            const username = document.getElementById('f-username').value.trim();
            const password = document.getElementById('f-password').value.trim();
            const category = document.getElementById('f-category').value;

            if (!title || !username || !password) {
                alert('กรุณากรอกข้อมูลช่องหลักให้ครบถ้วน');
                return;
            }

            if (id) {
                await supabaseClient.from('passwords').update({ title, username, password, category }).eq('id', id);
            } else {
                await supabaseClient.from('passwords').insert([{ user_id: currentUser.id, title, username, password, category }]);
            }

            await fetchPasswords();
            renderDashboard();
        }

        async function deletePassword(id) {
            if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                await supabaseClient.from('passwords').delete().eq('id', id);
                await fetchPasswords();
                renderDashboard();
            }
        }

        // หน้าเปลี่ยนรหัสผ่านส่วนตัว
        async function renderChangePassword() {
            document.getElementById('app').innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold">เปลี่ยนรหัสผ่านบัญชี</h2>
                    <button onclick="renderDashboard()" class="text-slate-400 text-sm">✕ กลับ</button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">รหัสผ่านใหม่</label>
                        <input type="password" id="new-pin" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <button onclick="updateUserPin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl text-sm transition">ยืนยันการเปลี่ยนรหัส</button>
                </div>
            `;
        }

        async function updateUserPin() {
            const newPin = document.getElementById('new-pin').value.trim();
            if (!newPin) {
                alert('กรุณากรอกรหัสผ่านใหม่');
                return;
            }

            const { error } = await supabaseClient.from('users').update({ pin: newPin }).eq('id', currentUser.id);
            if (error) {
                alert('เกิดข้อผิดพลาดในการเปลี่ยนรหัสผ่าน');
                return;
            }

            currentUser.pin = newPin;
            localStorage.setItem('vault_user', JSON.stringify(currentUser));
            alert('เปลี่ยนรหัสผ่านสำเร็จ!');
            renderDashboard();
        }

        init();
    </script>
</body>
</html>
